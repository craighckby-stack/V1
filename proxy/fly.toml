# Fly.io config for the Gemini geo-bypass proxy.
#
# Region: `sgp` (Singapore) — closest supported region to Hong Kong egress,
# ~40ms added RTT, irrelevant next to multi-second generation latency.
# Pinned (no auto-region) so the egress IP is deterministic — Google sees a
# consistent Singapore source, never a rolling one.
#
# Deploy:
#   fly launch --no-remote --name loop-gemini-proxy
#   fly secrets set PROXY_SECRET=$(openssl rand -hex 32) GEMINI_API_KEY=AIza...
#   fly deploy
#
# After first deploy, if you need to move regions, change `primary_region`
# below and `fly deploy` again. Existing volumes (none here) are region-bound.

app = "loop-gemini-proxy"
primary_region = "sgp"

[build]
  # Build from the Dockerfile in this directory (Bun base image).
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  # min_machines_running = 1 keeps the proxy warm so LOOP never hits a cold
  # start mid-cycle. Cost: ~$2/mo on the smallest shared-cpu-1x 256MB VM.
  # Set to 0 if you'd rather save the money and accept ~300ms cold starts.

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 50

# Smallest available machine — the proxy is I/O bound (forwards JSON),
# not CPU bound. 256MB is plenty; Bun itself uses ~30MB resident.
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
